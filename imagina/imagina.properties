# Parameters of the Imagina Mail build (see IMAGINA.md). No secrets here: this file is committed.
# imagina/imagina.local.properties (ignored by git) may override these keys on each machine, nothing else.

# Android application id. The OAuth redirect URI is "<id>://oauth2redirect" and must be registered
# on the OAuth client in Imagina.
IMAGINA_APPLICATION_ID=build.imagina.mail

# Imagina's identity server (OIDC, scopes "openid cloud.devices") and devices API
# (https://<host>/api/v1/cloud/devices), and the public OAuth client of this app.
# The mail servers and the credential of each mailbox come from the devices API.
IMAGINA_AUTH_HOST=auth.imagina.build
IMAGINA_OAUTH_CLIENT_ID=01a11c9a-6221-7131-b414-80769763ed18
